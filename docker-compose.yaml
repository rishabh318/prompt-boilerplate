version: '3.9'

services:
  ai_services:
    build: ./ai_services
    env_file:
      - ./ai_services/.env
    ports:
      - "8004:8000"

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9002:9000"   # External 9002 -> Internal 9000
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data

  media-api:
    build:
      context: ./media-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: media-bucket
      USE_SSL: "false"

volumes:
  minio_data:
